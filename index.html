<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="author" content="Javier Ruiz Herrera">
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <title>MiPortfolio</title>
    <link rel="stylesheet" href="css/estilos.css"/>
</head>
<body>
    <!-- CABECERA -->
    <header class="cabecera">
        <img src="assets/images/logo.png" alt="logo" class="logo">
        <nav class="navegacion">
            <a href="#" class="active">Inicio</a>
            <a href="pages/sobre-nosotros.html">Sobre Nosotros</a>
        </nav>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="principal">

        <div class="tarjeta" id="tarjeta-perfil">

            <!-- COLUMNA IZQUIERDA -->
            <div class="columna-izquierda">
                <div class="avatar">
                    <img src="https://via.placeholder.com/150" alt="Foto de perfil" id="foto-perfil"/>
                </div>
                <p id="campo-email">email@ejemplo.com</p>
                <div class="redes-sociales">
                    <a href="https://www.instagram.com" id="red-instagram">
                        <img src="assets/images/instagram.png" alt="instagram">
                    </a>
                    <a href="https://www.linkedin.com">
                        <img src="assets/images/linkedin.png" alt="linkedin">
                    </a>
                    <a href="https://www.facebook.com">
                        <img src="assets/images/facebook.png" alt="facebook">
                    </a>
                    <a href="https://www.github.com">
                        <img src="assets/images/github.png" alt="github">
                    </a>
                </div>
            </div>

            <!-- COLUMNA DERECHA -->
            <div class="columna-derecha">

            <div class="campo">
                <span class="etiqueta">Nombre</span>
                <span class="valor" id="campo-nombre">*****</span>
            </div>

            <div class="campo">
                <span class="etiqueta">Contraseña</span>
                <span class="valor" id="campo-contrasena">*****</span>
            </div>

            <div class="campo">
                <span class="etiqueta">Dirección</span>
                <span class="valor" id="campo-direccion">*****</span>
            </div>

            <div class="campo">
                <span class="etiqueta">Teléfono</span>
                <span class="valor" id="campo-telefono">*****</span>
            </div>

            <div class="campo">
                <span class="etiqueta">Fecha de nacimiento</span>
                <span class="valor" id="campo-fecha">*****</span>
            </div>

            </div>

        </div>
        <div class="next-user">
            <button class="reload-user">Siguiente usuario</button>
        </div>
    </main>

    <footer>
        <p>&copy; MiPorfolio - Todos los derechos reservados</p>
        <p>Lee también nuetros <a href="pages/condiciones.html">Terminios y condiciones</a></p>
            <div class="redes-sociales">
                <a href="https://www.instagram.com" id="red-instagram">
                    <img src="assets/images/instagram.png" alt="instagram">
                </a>
                <a href="https://www.linkedin.com">
                    <img src="assets/images/linkedin.png" alt="linkedin">
                </a>
                <a href="https://www.facebook.com">
                    <img src="assets/images/facebook.png" alt="facebook">
                </a>
                <a href="https://www.github.com">
                    <img src="assets/images/github.png" alt="github">
                </a>
            </div>
    </footer>

    <script src="js/javascript.js"></script>

</body>
</html>
